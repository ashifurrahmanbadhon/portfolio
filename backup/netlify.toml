# Netlify configuration for Ashifur Rahman Portfolio & CMS
[build]
  publish = "."

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/resume.pdf"
  [headers.values]
    Content-Disposition = 'inline; filename="Ashifur_Rahman_Resume.pdf"'
    Content-Type = "application/pdf"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
