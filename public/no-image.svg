<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090e" />
      <stop offset="50%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Card Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162032" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#1e2d44" opacity="0.8" />
    </pattern>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Technical Grid Overlay -->
  <rect width="1280" height="720" fill="url(#techGrid)" />

  <!-- Ambient Center Glow -->
  <circle cx="640" cy="360" r="420" fill="url(#centerGlow)" />

  <!-- Corner Blueprint Tech Accents -->
  <g stroke="#10b981" stroke-width="2" opacity="0.4" fill="none">
    <path d="M 40 70 L 40 40 L 70 40" />
    <path d="M 1210 40 L 1240 40 L 1240 70" />
    <path d="M 40 650 L 40 680 L 70 680" />
    <path d="M 1240 650 L 1240 680 L 1210 680" />
  </g>

  <!-- Central Card Backdrop -->
  <g transform="translate(640, 360)">
    <rect x="-340" y="-170" width="680" height="340" rx="24" fill="#090d16" fill-opacity="0.92" stroke="#1e293b" stroke-width="1.5" />
    <rect x="-340" y="-170" width="680" height="340" rx="24" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="12 12" />

    <!-- Icon Halo -->
    <circle cx="0" cy="-45" r="54" fill="#0e1524" stroke="#1e293b" stroke-width="2" />
    <circle cx="0" cy="-45" r="54" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Sleek Image / Photo Icon -->
    <g transform="translate(-24, -69) scale(2)" stroke="#10b981" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2" stroke="#64748b" />
      <circle cx="8.5" cy="8.5" r="1.5" fill="#10b981" stroke="none" />
      <polyline points="21 15 16 10 5 21" stroke="#34d399" />
    </g>

    <!-- Badge Label -->
    <g transform="translate(0, 35)">
      <rect x="-115" y="-14" width="230" height="28" rx="14" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
      <text text-anchor="middle" y="4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#34d399" letter-spacing="2.5">
        CREDENTIAL ON RECORD
      </text>
    </g>

    <!-- Primary Title -->
    <text text-anchor="middle" y="90" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#f1f5f9" letter-spacing="4">
      NO IMAGE AVAILABLE
    </text>

    <!-- Subtitle -->
    <text text-anchor="middle" y="122" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" letter-spacing="1.2">
      Official Coursework &amp; Certificate Verified by Institution
    </text>
  </g>
</svg>
